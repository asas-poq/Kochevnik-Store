x-backend: &backend
  image: kochevnik-backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: ./backend/.env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ubcashmere}:${POSTGRES_PASSWORD:-ubcashmere_secret}@postgres:5432/${POSTGRES_DB:-ubcashmere_db}
    REDIS_URL: redis://redis:6379/0
    PUBLIC_BASE_URL: ${SITE_URL:-http://localhost}
    LOG_FILE: ""
    LOG_JSON: "true"
    WEB_CONCURRENCY: "2"
    # api доступен только из сети compose, поэтому доверяем заголовкам nginx
    FORWARDED_ALLOW_IPS: "*"
  restart: unless-stopped

services:
  # ---------- Единая точка входа: http://localhost (через Nginx) ----------
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
    ports:
      - "80:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    restart: unless-stopped

  # ---------- Фронтенд ----------
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${SITE_URL:-http://localhost}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost}
    expose:
      - "3000"
    restart: unless-stopped

  # ---------- Базы данных и кэш ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ubcashmere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asa}
      POSTGRES_DB: ${POSTGRES_DB:-ubcashmere_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- Бэкенд (Сервисы) ----------

  migrate:
    <<: *backend
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - parser_data:/app/data/parser
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  # ---------- Мониторинг ----------
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    depends_on:
      - api
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# Конфиг Nginx соединен прямо здесь
configs:
  nginx_conf:
    content: |
      upstream api      { server api:8000; }
      upstream frontend { server frontend:3000; }

      server {
        listen 80;
        server_name _;
        client_max_body_size 100m;

        proxy_set_header Host              $$host;
        proxy_set_header X-Real-IP         $$remote_addr;
        proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $$scheme;
        proxy_set_header X-Request-ID      $$request_id;

        # Бэкенд и API
        location /api/    { proxy_pass http://api; }
        location /media/  { proxy_pass http://api; }
        location = /health { proxy_pass http://api; }
        location /docs    { proxy_pass http://api; }
        location /openapi.json { proxy_pass http://api; }
        location /sqladmin { proxy_pass http://api; }

        # Фронтенд (всё остальное)
        location / {
          proxy_pass http://frontend;
          proxy_http_version 1.1;
          proxy_set_header Upgrade    $$http_upgrade;
          proxy_set_header Connection "upgrade";
        }
      }

volumes:
  postgres_data:
  redis_data:
  media_data:
  parser_data:
  prometheus_data:
  grafana_data: